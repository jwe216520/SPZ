<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e8">
  <meta name="robots" content="noindex, nofollow">
  <title>給佩珍的一封信</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./content.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="masthead"><a href="./" aria-label="重新打開這封信">一封寫給佩珍的信 <span class="tiny-heart">♡</span></a><span>OUR LITTLE STORY</span></header>
  <div class="sound-control">
    <button id="sound-toggle" class="sound-toggle" type="button" aria-label="靜音" aria-pressed="true" title="靜音">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z"/>
        <g id="sound-waves"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g>
        <g id="sound-off" hidden><path d="m16 9 5 6m0-6-5 6"/></g>
      </svg>
    </button>
    <p id="sound-notice" class="sound-notice" hidden></p>
  </div>
  <p id="sound-status" class="sr-only" role="status" aria-live="polite"></p>
  <audio id="background-music" autoplay preload="auto" aria-hidden="true"></audio>
  <main class="layout">
    <section class="letter" aria-label="我們的故事，可左右滑動或使用鍵盤方向鍵翻頁">
      <div class="paper-edge" aria-hidden="true"></div>
      <div class="letter-inner">
        <div class="chapter-top"><span id="eyebrow">FOR YOU, WITH LOVE</span><span id="page-number">序</span></div>
        <div id="scene"></div>
        <div id="navigation" class="navigation" hidden>
          <p id="swipe-hint" class="swipe-hint">左滑下一頁 · 右滑上一頁</p>
          <span id="progress" aria-label="閱讀進度"></span>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">從那次相遇開始，故事慢慢有了我們。 <span aria-hidden="true">♡</span></footer>
  <noscript><p class="noscript">這封信需要 JavaScript 才能翻頁，請在瀏覽器中開啟 JavaScript。</p></noscript>
</body>
</html>
